name: Fabric 1.20.4 build
on:
  push:
    branches: ["main", "upgrade/4.1-cpvp"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build and run unit tests
        run: bash ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KTHREADD-fabric-1.20.4
          path: build/libs/KTHREADD-1.20.4-4.1.0-beta.1.jar
          if-no-files-found: error
